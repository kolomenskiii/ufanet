<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" fill="none">
  <title>Как проходит подключение — четыре шага</title>
  <desc>Оставьте заявку, мы проверим адрес, подберём тариф и подключим интернет.</desc>
  <defs>
    <linearGradient id="orange" x2=".85" y2="1">
      <stop stop-color="#FFA54B"/><stop offset="1" stop-color="#F5821F"/>
    </linearGradient>
    <linearGradient id="purple" x2=".85" y2="1">
      <stop stop-color="#A74BAF"/><stop offset="1" stop-color="#80298D"/>
    </linearGradient>
    <linearGradient id="paper" x2="0" y2="1">
      <stop stop-color="#FFF"/><stop offset="1" stop-color="#FDFBFE"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-35%" width="130%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dy="13" stdDeviation="10" flood-color="#37243E" flood-opacity=".16"/>
    </filter>
    <filter id="paper-shadow" x="-15%" y="-30%" width="130%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dy="7" stdDeviation="6" flood-color="#41213C" flood-opacity=".19"/>
    </filter>
    <g id="left-base">
      <rect x="20" y="39" width="960" height="150" rx="30" fill="#D9660C"/>
      <rect x="20" y="26" width="960" height="150" rx="30" fill="url(#orange)"/>
      <path d="M52 28H944" stroke="#FFF" stroke-opacity=".24" stroke-linecap="round"/>
    </g>
    <g id="right-base">
      <rect x="20" y="39" width="960" height="150" rx="30" fill="#60206D"/>
      <rect x="20" y="26" width="960" height="150" rx="30" fill="url(#purple)"/>
      <path d="M52 28H944" stroke="#FFF" stroke-opacity=".2" stroke-linecap="round"/>
    </g>
    <g id="left-paper">
      <path d="M227 4H972Q1000 4 1000 32V128Q1000 156 972 156H316Q294 156 282 136L208 32Q192 4 227 4Z" fill="url(#paper)" stroke="#E9E4EB" filter="url(#paper-shadow)"/>
      <path d="M232 18H970Q986 18 986 34V126Q986 142 970 142H319Q307 142 297 127L224 30Q215 18 232 18Z" stroke="#DDD6E0" stroke-width="1.5" stroke-dasharray="4 5"/>
      <path d="M399 40V120" stroke="#E6DFE9" stroke-width="2"/>
    </g>
    <g id="right-paper">
      <path d="M28 4H773Q808 4 792 32L718 136Q706 156 684 156H28Q0 156 0 128V32Q0 4 28 4Z" fill="url(#paper)" stroke="#E9E4EB" filter="url(#paper-shadow)"/>
      <path d="M30 18H768Q785 18 776 30L703 127Q693 142 681 142H30Q14 142 14 126V34Q14 18 30 18Z" stroke="#DDD6E0" stroke-width="1.5" stroke-dasharray="4 5"/>
      <path d="M601 40V120" stroke="#E6DFE9" stroke-width="2"/>
    </g>
  </defs>
  <g font-family="Manrope, 'Segoe UI', Arial, sans-serif">
    <g transform="translate(160 16)">
      <use href="#left-base" filter="url(#shadow)"/>
      <text x="114" y="113" text-anchor="middle" fill="#FFF" font-size="78" font-weight="800" letter-spacing="-5">01</text>
      <text x="114" y="142" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700" letter-spacing="3">ШАГ</text>
      <use href="#left-paper"/>
      <g transform="translate(316 48)" stroke="#F5821F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect width="42" height="54" x="2" y="2" rx="7" fill="#FFF1E5" stroke="none"/>
        <path d="M10 2H36A4 4 0 0 1 40 6V54H6V6A4 4 0 0 1 10 2Z"/>
        <path d="M14 15H31M14 24H31M14 33H24M28 43L34 49L46 35"/>
      </g>
      <text x="430" y="55" fill="#A94B08" font-size="28" font-weight="800" letter-spacing="-.7">Вы оставляете заявку</text>
      <g fill="#F5821F"><circle cx="434" cy="73" r="3"/><circle cx="447" cy="73" r="3" opacity=".5"/><circle cx="460" cy="73" r="3" opacity=".25"/></g>
      <text x="430" y="103" fill="#615C68" font-size="19">
        <tspan x="430">Указываете адрес и контакты, чтобы мы проверили</tspan>
        <tspan x="430" dy="27">техническую возможность подключения.</tspan>
      </text>
    </g>
    <g transform="translate(40 222)">
      <use href="#right-base" filter="url(#shadow)"/>
      <text x="886" y="113" text-anchor="middle" fill="#FFF" font-size="78" font-weight="800" letter-spacing="-5">02</text>
      <text x="886" y="142" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700" letter-spacing="3">ШАГ</text>
      <use href="#right-paper"/>
      <g transform="translate(642 48)" stroke="#80298D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="24" cy="22" r="25" fill="#F4EAF6" stroke="none"/>
        <path d="M24 55S43 38 43 20A19 19 0 1 0 5 20C5 38 24 55 24 55Z"/>
        <circle cx="24" cy="20" r="7"/>
        <path d="M34 43L40 49L51 35"/>
      </g>
      <text x="565" y="55" text-anchor="end" fill="#80298D" font-size="28" font-weight="800" letter-spacing="-.7">Проверяем адрес</text>
      <g fill="#80298D"><circle cx="561" cy="73" r="3"/><circle cx="548" cy="73" r="3" opacity=".5"/><circle cx="535" cy="73" r="3" opacity=".25"/></g>
      <text x="565" y="103" text-anchor="end" fill="#615C68" font-size="19">
        <tspan x="565">Смотрим доступные скорости, сроки подключения</tspan>
        <tspan x="565" dy="27">и варианты оборудования для вашего дома.</tspan>
      </text>
    </g>
    <g transform="translate(160 428)">
      <use href="#left-base" filter="url(#shadow)"/>
      <text x="114" y="113" text-anchor="middle" fill="#FFF" font-size="78" font-weight="800" letter-spacing="-5">03</text>
      <text x="114" y="142" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700" letter-spacing="3">ШАГ</text>
      <use href="#left-paper"/>
      <g transform="translate(314 50)" stroke="#F5821F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="0" width="50" height="52" rx="12" fill="#FFF1E5" stroke="none"/>
        <path d="M6 12H44M6 27H44M6 42H44"/>
        <rect x="14" y="6" width="8" height="12" rx="3" fill="#FFF"/>
        <rect x="31" y="21" width="8" height="12" rx="3" fill="#FFF"/>
        <rect x="18" y="36" width="8" height="12" rx="3" fill="#FFF"/>
      </g>
      <text x="430" y="55" fill="#A94B08" font-size="28" font-weight="800" letter-spacing="-.7">Подбираем тариф</text>
      <g fill="#F5821F"><circle cx="434" cy="73" r="3"/><circle cx="447" cy="73" r="3" opacity=".5"/><circle cx="460" cy="73" r="3" opacity=".25"/></g>
      <text x="430" y="103" fill="#615C68" font-size="19">
        <tspan x="430">Предлагаем скорость, роутер, ТВ и другие опции</tspan>
        <tspan x="430" dy="27">под ваши задачи и количество устройств.</tspan>
      </text>
    </g>
    <g transform="translate(40 634)">
      <use href="#right-base" filter="url(#shadow)"/>
      <text x="886" y="113" text-anchor="middle" fill="#FFF" font-size="78" font-weight="800" letter-spacing="-5">04</text>
      <text x="886" y="142" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700" letter-spacing="3">ШАГ</text>
      <use href="#right-paper"/>
      <g transform="translate(640 49)" stroke="#80298D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="0" width="54" height="54" rx="14" fill="#F4EAF6" stroke="none"/>
        <rect x="3" y="32" width="48" height="16" rx="5"/>
        <path d="M12 32V24M42 32V24M13 13A20 20 0 0 1 41 13M20 21A10 10 0 0 1 34 21"/>
        <circle cx="13" cy="40" r="1.5" fill="#80298D" stroke="none"/>
        <path d="M34 40H41"/>
      </g>
      <text x="565" y="55" text-anchor="end" fill="#80298D" font-size="28" font-weight="800" letter-spacing="-.7">Подключаем интернет</text>
      <g fill="#80298D"><circle cx="561" cy="73" r="3"/><circle cx="548" cy="73" r="3" opacity=".5"/><circle cx="535" cy="73" r="3" opacity=".25"/></g>
      <text x="565" y="103" text-anchor="end" fill="#615C68" font-size="19">
        <tspan x="565">Проводим монтаж, настраиваем оборудование</tspan>
        <tspan x="565" dy="27">и проверяем, что связь работает стабильно.</tspan>
      </text>
    </g>
  </g>
</svg>
